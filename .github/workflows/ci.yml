name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + test dependencies
        run: |
          pip install fastapi "uvicorn[standard]" httpx pytest rich
          # Full requirements.txt (ML extras for jailbreak training) is
          # intentionally NOT installed here — it's heavy and unrelated
          # to gateway correctness. Training is a separate, manual job.

      - name: Run tests
        run: pytest -v
